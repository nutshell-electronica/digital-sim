*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header.top{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--bd);background:#F3F1EC}
.auth{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;white-space:nowrap}.auth .av,.rbrand .av{border-radius:50%;display:block}
.brand{font-weight:700;letter-spacing:.12em;font-size:12px;color:var(--ac);padding-left:12px;border-left:1px solid var(--bd)}
.menu{display:flex;gap:2px;margin-left:6px}.menu button{border:0;background:transparent;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:13px}.menu button:hover{background:var(--sgs)}
.pcur{margin-left:auto;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
#tabs{flex:none;display:flex;gap:0;border-bottom:1px solid var(--bd);background:var(--bg);padding:0 8px}#tabs button{border:0;background:transparent;padding:8px 16px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;color:var(--t2)}#tabs button:hover{color:var(--tx);background:var(--sgs)}#tabs button.on{color:var(--tx);font-weight:700;border-bottom-color:var(--ac)}
#status{flex:none;height:24px;display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--bd);background:#F3F1EC;font:12px 'Courier New',monospace;color:var(--t2)}#status .sp{flex:1}#status #st3{font-family:Arial;color:var(--t2)}#status .warnt{color:var(--ac);font-weight:700}
#menupop{position:absolute;z-index:70;background:var(--bg);border:1px solid var(--bd);border-radius:6px;min-width:210px;padding:4px}#menupop[hidden]{display:none}#menupop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;border-radius:4px}#menupop button:hover{background:var(--sgs)}
main{flex:1;min-height:0;position:relative}
.pg{height:100%;overflow:auto}.pg[hidden]{display:none}
#toast{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:6px;max-width:70%;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}#toast.on{opacity:1}
.ov{position:absolute;inset:0;background:#F9F8F6;z-index:50;overflow:auto;padding:26px 40px 40px}.ov[hidden]{display:none}.ovc{max-width:1180px;margin:0 auto}.ovc h3{font-size:24px;margin:2px 0 8px}.ovx{position:fixed;right:22px;top:58px;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);font-size:20px;cursor:pointer;z-index:60}.ovx:hover{background:var(--sgs)}
.plgrid{display:grid;grid-template-columns:1fr 340px;gap:36px;margin-top:10px}
.idx{display:flex;flex-direction:column}.idx button{display:grid;grid-template-columns:70px 220px 1fr;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:14px 4px;cursor:pointer}.idx button:hover{background:var(--sgs)}.idx span{font-size:30px;color:var(--sg);font-weight:700}.idx b{font-size:17px}.idx small{color:var(--t2);font-size:13px}
.gls{columns:2 360px;gap:36px}.gls div{break-inside:avoid;border-bottom:1px solid var(--bd);padding:9px 0}.gls b{display:block;color:var(--ac)}.gls i{display:block;color:var(--t2)}.gls span{font-size:13px}.hl p{margin:0 0 14px;max-width:820px}
/* botones y formularios */
.b{border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px}.b:hover{background:var(--sgs)}.b.prim{background:var(--ac);color:var(--bg);border-color:var(--ac)}.b.sm{padding:3px 8px;font-size:12px}.b.on{background:var(--sgs);border-color:var(--sg)}
input[type=text],input:not([type]),select,textarea{border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:5px 8px}input.sm{width:62px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--t2)}label.inl{flex-direction:row;align-items:center;gap:6px}label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:13px;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:8px 0}.mut{color:var(--t2);font-size:12px}.card{border:1px solid var(--bd);border-radius:6px;padding:12px 14px;background:var(--bg);margin:0 0 14px}.ch{font-weight:700;margin-bottom:6px}.ph{font-weight:700;margin:12px 0 6px;color:var(--ac);font-size:13px}
.warn{background:#F6E9E3;border-left:4px solid var(--ac);padding:6px 8px;margin:6px 0;font-size:12px}
/* inicio */
.home{display:grid;grid-template-columns:420px 1fr;gap:56px;max-width:1380px;margin:0 auto;padding:36px 40px}.home h1{font-size:40px;line-height:1.1;margin:10px 0 14px}.lead{font-size:16px;color:var(--t2)}.inv{border-left:3px solid var(--sg);padding:2px 0 2px 14px;margin:18px 0;font-size:13px}.inv p{margin:5px 0}.ih{font-weight:700;color:var(--ac);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.prow{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--bd)}.prow.cur .pt{color:var(--ac)}.pn{font-size:30px;font-weight:700;color:var(--sg)}.pt{font-weight:700;font-size:16px}.pd{color:var(--t2);font-size:13px}.pm{font-size:12px;color:var(--t2);margin-top:2px}
/* editores */
.ed{display:grid;grid-template-columns:190px 1fr 260px;height:100%}.ed[hidden]{display:none}.ed-left,.ed-right{overflow:auto;padding:8px;border-right:1px solid var(--bd)}.ed-right{border-right:0;border-left:1px solid var(--bd)}
.ed-main{display:flex;flex-direction:column;min-width:0;min-height:0}.tb{display:flex;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--bd)}.sp{flex:1}.tstat{font:12px 'Courier New',monospace;color:var(--t2)}
.cv{position:relative;flex:1;min-height:220px;overflow:hidden}.cv svg{width:100%;height:100%;display:block;background:var(--bg);user-select:none}
.hint{position:absolute;left:10px;bottom:8px;opacity:.85;pointer-events:none;background:rgba(249,248,246,.92);border:1px solid var(--bd);border-radius:6px;padding:4px 9px;font-size:12px;color:var(--t2);max-width:60%}
.tip{position:absolute;display:none;background:var(--tx);color:var(--bg);padding:4px 8px;border-radius:5px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:5}
.tpanel{border-top:1px solid var(--bd);max-height:34%;overflow:auto}.tpanel canvas{width:100%;display:block}.tp-b{display:flex;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid var(--bd)}
.pal-h{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:6px}.pal details{margin-bottom:6px}.pal summary{cursor:pointer;font-weight:700;font-size:12px;padding:4px 0;color:var(--tx)}
.pi{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:5px;padding:4px 7px;font-size:12px;cursor:pointer}.pi:hover{background:var(--sgs)}.pi.on{border-color:var(--ac);background:var(--sgs)}
.props label{margin:6px 0}.props .dmm{font:22px 'Courier New',monospace;background:#D5DAC6;border:1px solid #888;border-radius:4px;padding:6px 10px;margin:8px 0;text-align:right}

/* ---------- documento ---------- */
class Doc {
  constructor() { this.parts = []; this.wires = []; this.nid = 1; this.zones = []; }
  add(kind, x, y, props) { const k = KIND[kind]; if (!k) throw new Error('kind ' + kind); const p = { id: 'p' + this.nid++, kind, x, y, props: Object.assign({}, JSON.parse(JSON.stringify(k.props)), props || {}) }; this.parts.push(p); return p; }
  wire(a, an, b, bn) { const w = { id: 'w' + this.nid++, a: { p: a.id, n: an }, b: { p: b.id, n: bn } }; this.wires.push(w); return w; }
  part(id) { return this.parts.find(p => p.id === id); }
  remove(id) { this.parts = this.parts.filter(p => p.id !== id); this.wires = this.wires.filter(w => w.a.p !== id && w.b.p !== id); }
  toJSON() { return { parts: this.parts, wires: this.wires, nid: this.nid, zones: this.zones }; }
  static from(j) { const d = new Doc(); d.parts = j.parts; d.wires = j.wires; d.nid = j.nid; d.zones = j.zones || []; return d; }
}
S.Doc = Doc;
KIND.JN = { name: 'Nudo', group: 'Cables', hidden: true, props: {}, geom: () => ({ w: 0, h: 0, pins: [{ n: 'P', x: 0, y: 0 }] }), draw: () => `<circle cx="0" cy="0" r="7" fill="transparent"/>` };
const geomOf = (p) => { const g = KIND[p.kind].geom(p); if (p.rot !== 90) return g; return { w: g.h, h: g.w, base: g, pins: g.pins.map(q => ({ n: q.n, x: g.h - q.y, y: q.x, out: q.out })) }; };
const drawPart = (p, g, rt) => p.rot === 90 ? `<g transform="translate(${g.base.h},0) rotate(90)">${KIND[p.kind].draw(p, g.base, rt)}</g>` : KIND[p.kind].draw(p, g, rt);
/* ruta del cable: lista de puntos (a, codos…, b) */
const routeOf = (doc, w) => { const a = pinPos(doc, w.a.p, w.a.n), b = pinPos(doc, w.b.p, w.b.n); if (!a || !b) return null;
  if (w.pts && (w.pts.length || a.x === b.x || a.y === b.y)) return [a, ...w.pts, b];
  if (a.x === b.x || a.y === b.y) return [a, b];
  if (b.x >= a.x + 20 && Math.abs(b.y - a.y) > 10) { const mx = Math.round((a.x + b.x) / 20) * 10; return [a, { x: mx, y: a.y }, { x: mx, y: b.y }, b]; }
  return orthoPath([a, b]); };
const NOIMG = (() => { const i = new Image(); i.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; return i; })();
/* ruta ortogonal por los puntos dados: tramos rectos y, si dos puntos no están alineados, un codo; el último tramo entra en la patilla en horizontal */
const orthoPath = (P) => { const o = [{ x: P[0].x, y: P[0].y }];
  for (let i = 1; i < P.length; i++) { const u = o[o.length - 1], v = P[i], prev = o.length > 1 ? o[o.length - 2] : null;
    if (u.x !== v.x && u.y !== v.y) { const hor = prev ? prev.y === u.y : Math.abs(v.x - u.x) >= Math.abs(v.y - u.y); o.push(hor ? { x: v.x, y: u.y } : { x: u.x, y: v.y }); }
    o.push({ x: v.x, y: v.y }); }
  return cleanPts(o); };
const ptsD = (P) => P.map((q, i) => (i ? 'L' : 'M') + q.x + ',' + q.y).join(' ');
const cleanPts = (P) => { const o = []; P.forEach(q => { const l = o[o.length - 1]; if (l && l.x === q.x && l.y === q.y) return; o.push({ x: q.x, y: q.y }); });
  for (let i = o.length - 2; i > 0; i--) { const a = o[i - 1], b = o[i], c = o[i + 1]; if ((a.x === b.x && b.x === c.x) || (a.y === b.y && b.y === c.y)) o.splice(i, 1); } return o; };
const pinPos = (doc, pid, n) => { const p = doc.part(pid); if (!p) return null; const g = geomOf(p), pn = g.pins.find(q => q.n === n); return pn ? { x: p.x + pn.x, y: p.y + pn.y } : null; };

/* ---------- compilación a la red del motor ---------- */
S.compile = function (doc, opt = {}) {
  const nb = new DSim.NetBuilder(), refs = {}, conn = new Set(), pid = (p, n) => p.id + '.' + n;
  doc.wires.forEach(w => { nb.join(w.a.p + '.' + w.a.n, w.b.p + '.' + w.b.n); conn.add(w.a.p + '.' + w.a.n); conn.add(w.b.p + '.' + w.b.n); });
  const cid = (p, n) => conn.has(pid(p, n)) ? pid(p, n) : null;
  const push = (p, part) => { part.ref = p.id; nb.part(part); return nb.parts.length - 1; };
  const watches = [];
  doc.parts.forEach(p => {
    const k = p.kind, pr = p.props;
    if (k === 'SW') refs[p.id] = push(p, { type: 'SRC', mode: 'level', level: +pr.on, pinIds: [pid(p, 'Y')] });
    else if (k === 'PUSH') refs[p.id] = push(p, { type: 'SRC', mode: 'level', level: pr.inv ? 1 : 0, pinIds: [pid(p, 'Y')] });
    else if (k === 'SWM') refs[p.id] = push(p, { type: 'SW', closed: !!+pr.on, pinIds: [pid(p, 'A'), pid(p, 'B')] });
    else if (k === 'PSH') refs[p.id] = push(p, { type: 'SW', closed: !!+pr.nc, pinIds: [pid(p, 'A'), pid(p, 'B')] });
    else if (k === 'CLK') refs[p.id] = push(p, { type: 'SRC', mode: 'clock', hz: Math.max(1e-3, +pr.hz || 1), duty: 0.5, pinIds: [pid(p, 'Y')] });
    else if (k === 'HI') push(p, { type: 'V', v: 5, pinIds: [pid(p, 'P')] });
    else if (k === 'LO') nb.join(pid(p, 'P'), 'GND');
    else if (k === 'R') push(p, { type: 'R', r: Math.max(S.parseVal(pr.v) || 1, 1e-3), pinIds: [pid(p, 'A'), pid(p, 'B')] });
    else if (k === 'C') push(p, { type: 'C', c: S.parseVal(pr.v) || 1e-9, pinIds: [pid(p, 'A'), pid(p, 'B')] });
    else if (k === 'LED') { push(p, { type: 'R', r: S.parseVal(pr.r) || 330, pinIds: [pid(p, 'A'), pid(p, 'led')] }); refs[p.id] = push(p, { type: 'LED', color: pr.color, pinIds: [pid(p, 'led'), 'GND'] }); }
    else if (k === 'D7') { const ids = []; ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'dp'].forEach(n => { const mid = pid(p, 's' + n); push(p, { type: 'R', r: 330, pinIds: [pid(p, n), mid] }); ids.push(mid); }); refs[p.id] = push(p, { type: 'DISP7', color: 'red', ca: +pr.ca, pinIds: [...ids, pid(p, 'COM')] }); }
    else if (k.startsWith('FF')) { const kind = k.slice(2); refs[p.id] = push(p, { type: 'FF', kind: kind === 'D' ? 'D' : kind === 'T' ? 'T' : 'JK', edge: pr.edge, pinIds: [cid(p, kind === 'JK' ? 'J' : kind), cid(p, 'CK') || pid(p, 'CK'), kind === 'JK' ? cid(p, 'K') : null, cid(p, 'PR'), cid(p, 'CLR'), pid(p, 'Q'), pid(p, 'QN')] }); }
    else if (k === 'VM') refs[p.id] = push(p, { type: 'VM', pinIds: [pid(p, 'P'), pid(p, 'N')] });
    else if (k === 'PROBE') refs[p.id] = { node: pid(p, 'P') };
    else if (k === 'DMM') refs[p.id] = push(p, { type: pr.mode === 'A' ? 'AMM' : 'VM', pinIds: [pid(p, 'P'), pid(p, 'N')] });
    else if (k === 'WATCH') watches.push({ label: pr.label, id: pid(p, 'P') });
    else if (KIND[k].ic) {
      const d = DSim.IC[KIND[k].ic], ids = []; for (let i = 1; i <= d.n; i++) ids.push(cid(p, String(i)));
      if (opt.autoPower !== false) { if (d.vcc && ids[d.vcc - 1] === null) { ids[d.vcc - 1] = pid(p, 'avcc'); nb.part({ type: 'V', v: 5, pinIds: [pid(p, 'avcc')], auto: 1 }); } if (d.gnd && ids[d.gnd - 1] === null) ids[d.gnd - 1] = 'GND'; }
      refs[p.id] = push(p, { type: 'IC', ic: d.id, label: pr.label || d.name, pinIds: ids });
    }
    else if (k.startsWith('GATE')) { }
    else if (DSim.GATES[k]) { const n = (k === 'NOT' || k === 'BUF') ? 1 : +pr.n, ins = []; for (let i = 0; i < n; i++) ins.push(pid(p, 'ABCD'[i])); refs[p.id] = push(p, { type: 'GATE', fn: k, pinIds: [...ins, pid(p, 'Y')] }); }
  });
  const nl = nb.build();
  return { nl, refs, watches, nb };
};

PR.enun = {"10.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a usar el depurador del editor de código de Tinkercad para revisar el valor de todas las variables del programa de la práctica 9.1, usando puntos de ruptura, y a localizar un fallo que te introduce un compañero.","Depurar es la herramienta básica del mantenimiento de equipos microprogramables: localizar un fallo de programa sin tocar el hardware. Según la programación, la unidad 10 se desarrolla durante la formación en empresa; esta práctica queda para quien no la realice en ese periodo o como refuerzo a la vuelta, según indique el profesor.","Trabajas el RA5 criterio h y RA6 criterios a y b."]},{"t":"ENUNCIADO","p":["Abre tu proyecto de la práctica 9.1 en Tinkercad y activa el depurador (botón del editor de código). Los puntos de ruptura se ponen pulsando sobre el número de línea: el programa se para en esa línea y ves el valor de las variables; después puedes avanzar paso a paso.","Pon un punto de ruptura en la línea donde se incrementan los segundos, arranca la simulación y comprueba el valor de todas las variables cuando se para. Avanza hasta un desbordamiento de minutos y de horas. Después, un compañero introduce un fallo en una copia de tu programa (por ejemplo, que los minutos desborden en 59) y tú lo localizas usando solo el depurador."]},{"t":"ANTES DE EMPEZAR","p":["Pon el punto de ruptura en una línea que se ejecute (si no, el programa no se para). Quita los puntos de ruptura cuando termines: si no, el programa parece «colgado»."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío (salvo la ampliación, que es opcional).","Las capturas del depurador se leen y muestran las variables.","Has quitado los puntos de ruptura al terminar.","Has usado puntos de ruptura y has comprobado el valor de todas las variables.","Has localizado el fallo del compañero y sabes explicar cómo."]}],"heads":["1. Preparación","2. Puntos de ruptura y valor de las variables","3. Fallo introducido por un compañero","4. Preguntas","5. Ampliación (opcional)"]},"1.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a montar las dos formas de fijar el nivel lógico de una entrada con un pulsador: pull-up (resistencia a +5 V) y pull-down (resistencia a masa). Los dibujarás en SimulIDE y en Tinkercad Circuits, los montarás en la protoboard y medirás tensión y corriente.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas, con los números y las operaciones.","En el taller usamos para pull-up y pull-down resistencias entre 4,7 kΩ y 10 kΩ. Si el consumo es importante (por ejemplo, un equipo con pilas) se puede usar una más grande, a cambio de que el nudo sea más sensible al ruido.","Trabajas el RA1, criterios a, b y e."]},{"t":"SEGURIDAD","p":["Apaga la fuente antes de cambiar cables y no unas nunca +5 V y GND sin una resistencia en medio."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo lleva sus números, no solo el resultado.","Has medido y anotado con unidades (V, mA, Ω)."]}],"heads":["1. Elección y cálculos","2. Esquemas en los simuladores","3. Foto del montaje","4. Medidas","5. Aspectos a resaltar"]},"2.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a identificar seis integrados de puertas lógicas (NOT, AND, OR, NAND, NOR y XOR), a comprobar en la protoboard que cada puerta cumple su tabla de verdad y a medir sus tensiones de salida para decidir, con la hoja de características, si el integrado está apto o no apto, como en un banco de reparación.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y unidades.","Trabajas el RA1, criterios a, c, d y e."]},{"t":"ANTES DE DAR TENSIÓN","p":["Revisa la alimentación del integrado: +5 V en la patilla 14 y GND en la 7. Invertirlas destruye el chip. Monta y cambia cables siempre sin tensión y sin entradas al aire."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo lleva sus números, no solo el resultado.","Todas las medidas llevan unidades (V, Ω) y los integrados están identificados."]}],"heads":["1. Identificar los integrados","2. Datos de la hoja de características","3. Integrado 1 · NOT (inversor)","4. Integrado 2 · AND","5. Integrado 3 · OR","6. Integrado 4 · NAND","7. Integrado 5 · NOR","8. Integrado 6 · XOR","9. Preguntas","10. Aspectos a resaltar"]},"3.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar un semáforo electrónico: tabla de verdad, mapa de Karnaugh, circuito con puertas de 2 entradas, simulación en Logisim, SimulIDE y Tinkercad, y montaje real en la protoboard.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA2, criterios a, c, d y f."]},{"t":"ENUNCIADO","p":["Un semáforo electrónico atiende a tres sensores activos a nivel alto: D (viene un vehículo por la derecha), I (viene un vehículo por la izquierda) y P (hay peatones). Según ellos, activa o desactiva tres indicadores: E (modo espera), PV (paso de vehículos) y PP (paso de peatones).","– Si no viene nadie ni por la derecha ni por la izquierda y hay peatones: cierra el paso de vehículos, abre el de peatones y desactiva el modo espera.","– Si vienen vehículos por la derecha y por la izquierda, haya o no peatones: abre el paso de vehículos, cierra el de peatones y desactiva el modo espera.","– Si solo viene vehículos de un lado y hay peatones: activa el modo espera y desactiva el paso de vehículos y el de peatones.","– En cualquier otro caso, las salidas tienen un valor indeterminado (X).","Usa el orden de variables D, I, P (D es la más significativa)."]},{"t":"ANTES DE DAR TENSIÓN","p":["Alimentación de cada integrado: +5 V en la patilla 14 y GND en la 7 (comprueba el patillaje de cada referencia en su hoja de datos). Monta y cambia cables sin tensión, no dejes entradas al aire y pon una resistencia en serie con cada LED."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Las 8 filas de la tabla obtenida en el montaje real coinciden con la esperada.","El esquema de Logisim, el de SimulIDE, el de Tinkercad y el montaje real son el mismo circuito."]}],"heads":["1. Tabla de verdad","2. Mapas de Karnaugh y simplificación","3. Circuito con puertas de 2 entradas","4. Esquema lógico en Logisim","5. Esquema físico en SimulIDE y Tinkercad","6. Lista de integrados y conexiones","7. Montaje paso a paso en la protoboard","8. Foto del montaje","9. Comprobación de la tabla de verdad en el montaje real","10. Aspectos a resaltar"]},"3.2":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar el control de una máquina clasificadora de aguacates con cuatro sensores y dos salidas: tabla de verdad de 16 filas, mapas de Karnaugh de 4 variables, circuito con puertas de 2 entradas, simulación en Logisim, SimulIDE y Tinkercad, y montaje en la protoboard.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA2, criterios a, c, d y f."]},{"t":"ENUNCIADO","p":["Imagina que tenemos un sistema automático de control de calidad de aguacates en una planta envasadora que toma datos de los sensores S1, S2, S3 y S4 y que degrada de calidad las piezas (D) en los siguientes casos:","– Todos los sensores desactivos.","– Todos los sensores activos.","– Activo sólo el sensor S3.","– Activos sólo los sensores S1, S2.","– Activos sólo los sensores S1, S2, S3.","– Activos sólo los sensores S1, S2, S4.","– Activos sólo los sensores S1, S4.","– Activos sólo los sensores S1, S3, S4.","En otros casos los tomará como una calidad superior (C):","– Activos sólo los sensores S3, S4.","– Activos sólo los sensores S2, S3, S4.","Plantea la tabla de verdad, el mapa de Karnaugh y simplifica agrupando los 1. Posteriormente implementa el circuito resultante empleando puertas lógicas de 2 entradas como máximo.","Datos para la tabla: D y C son dos salidas independientes, cada una con su propio mapa de Karnaugh, y las combinaciones que no aparecen en ninguna lista dejan ambas salidas a 0. Usa el orden S1, S2, S3, S4 (S1 la más significativa)."]},{"t":"ANTES DE DAR TENSIÓN","p":["Alimentación de cada integrado: +5 V en la patilla 14 y GND en la 7 (comprueba el patillaje de cada referencia en su hoja de datos). Monta y cambia cables sin tensión, no dejes entradas al aire y pon una resistencia en serie con cada LED."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Las 16 filas de la tabla obtenida en el montaje real coinciden con la esperada.","El esquema de Logisim, el de SimulIDE, el de Tinkercad y el montaje real son el mismo circuito."]}],"heads":["1. Tabla de verdad","2. Mapa de Karnaugh y simplificación","3. Circuito con puertas de 2 entradas","4. Esquema lógico en Logisim","5. Esquema físico en SimulIDE y Tinkercad","6. Lista de integrados y conexiones","7. Montaje paso a paso en la protoboard","8. Foto del montaje","9. Comprobación de la tabla de verdad en el montaje real","10. Aspectos a resaltar"]},"3.3":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar un multiplexor de 2 entradas a 1 salida con puertas lógicas y a rehacerlo usando solo puertas NAND. Lo simularás en Logisim, SimulIDE y Tinkercad y lo montarás en la protoboard.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA2, criterios a, c, d y f."]},{"t":"ENUNCIADO","p":["Se quiere montar con puertas lógicas un multiplexor de dos entradas (E1 y E0) a una salida (X). Para ello hay que considerar las combinaciones de la entrada de selección S0 que hacen que una cierta entrada llegue a la salida.","Para hacer la tabla de verdad, pon S0 como entrada más significativa (orden S0, E1, E0).","Después, modifica el circuito para montarlo usando solo puertas NAND."]},{"t":"ANTES DE DAR TENSIÓN","p":["Alimentación de cada integrado: +5 V en la patilla 14 y GND en la 7 (comprueba el patillaje de cada referencia en su hoja de datos). Monta y cambia cables sin tensión, no dejes entradas al aire y pon una resistencia en serie con cada LED.","Recuerda que una NAND con las dos entradas unidas funciona como inversor."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Las 8 filas de la tabla obtenida en el montaje real coinciden con la esperada.","El esquema de Logisim, el de SimulIDE, el de Tinkercad y el montaje real son el mismo circuito."]}],"heads":["1. Tabla de verdad","2. Mapa de Karnaugh y simplificación","3. Versión con puertas básicas y versión solo NAND","4. Esquema lógico en Logisim","5. Esquema físico en SimulIDE y Tinkercad","6. Lista de integrados y conexiones","7. Montaje paso a paso en la protoboard","8. Foto del montaje","9. Comprobación de la tabla de verdad en el montaje real","10. Aspectos a resaltar"]},"4.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a comprobar cómo funciona un multiplexor de 8 a 1, a usarlo para generar una función lógica y a montarlo de verdad. Lo dejarás preparado para enlazarlo con el demultiplexor de la práctica 4.2.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA2, criterios b, e y f."]},{"t":"ENUNCIADO","p":["El 74151 (74HC151 si trabajas con CMOS) elige una de sus 8 entradas de datos D0 a D7 según las líneas de selección C B A (A es la de menor peso) y la lleva a la salida Y; W es la misma salida negada. La entrada G (habilitación) es activa a nivel bajo.","Tienes que usar un patrón fijo en los datos: D7 D6 D5 D4 D3 D2 D1 D0 = 1 0 1 1 0 0 1 0. Después, con las mismas selecciones, tienes que obtener la función F(C, B, A) = Σ(1, 2, 4, 7) (vale 1 cuando hay un número impar de unos en C B A)."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje, la alimentación y el nombre de las entradas del integrado. Monta y cambia cables sin tensión, no dejes entradas al aire (G incluida) y pon una resistencia en serie con cada LED, calculada con la corriente que admite la salida."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Las 8 filas de la tabla obtenida coinciden con la esperada, para el patrón y para F."]}],"heads":["1. Hoja de datos","2. Tabla de funcionamiento","3. Una función con el multiplexor","4. Esquemas en los simuladores","5. Conexiones del integrado","6. Foto del montaje","7. Comprobaciones en el montaje real"]},"4.2":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a usar un decodificador como demultiplexor y a conectarlo con el multiplexor de la práctica 4.1 para transmitir 8 señales por un solo cable.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA2, criterios b, e y f."]},{"t":"ENUNCIADO","p":["El 7442 (74HC42 en CMOS) es un decodificador de BCD a decimal: 4 entradas D C B A (A la de menor peso) y 10 salidas 0 a 9, activas a nivel bajo. Si usas C B A como selección y D como dato, sus salidas 0 a 7 se comportan como un demultiplexor de 1 a 8.","Después enlazarás el 74151 con el 7442: la salida Y del multiplexor va a la entrada D del demultiplexor y las líneas de selección C B A de los dos se unen. Para la prueba, usa el patrón D7 D6 D5 D4 D3 D2 D1 D0 = 1 0 1 1 0 0 1 0 en el 74151."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje y la alimentación del 7442 y del 74151. Monta y cambia cables sin tensión, no dejes entradas al aire y pon una resistencia en serie con cada LED. Las salidas del 7442 son activas a nivel bajo: un LED conectado a +5 V con su resistencia se enciende cuando la salida vale 0."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Las 8 filas de la cadena comprobadas coinciden con las esperadas."]}],"heads":["1. El 7442 solo","2. El 7442 como demultiplexor","3. Cadena 74151 a 7442","4. Esquemas en los simuladores","5. Conexiones del integrado","6. Foto del montaje","7. Comprobaciones finales"]},"5.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar, simular y montar un contador que cuenta hacia abajo, 7, 6, 5 … 0, con tres biestables JK. Aprenderás por qué un contador «de rizado» cuenta hacia abajo o hacia arriba según de dónde saques el reloj de cada etapa.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA3, criterios a, b, d y e."]},{"t":"ENUNCIADO","p":["Cada biestable JK se usa en modo basculante (J = K = 1): cambia de estado en cada flanco activo de su reloj. El reloj de la primera etapa es la señal externa; el de cada una de las siguientes lo tomas de una salida de la etapa anterior.","Tienes que conseguir que el conjunto Q2 Q1 Q0 cuente en binario 7, 6, 5, 4, 3, 2, 1, 0, 7… (descendente). Para empezar en 7, pon los tres biestables a 1 con preset y devuelve el preset a su nivel inactivo antes de dar relojes.","Opcional: puedes sustituir los LED por un display de 7 segmentos con su decodificador para ver la cuenta en decimal."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje y la alimentación. Monta y cambia cables sin tensión, no dejes entradas al aire (preset y clear incluidos) y pon una resistencia en serie con cada LED, calculada con la corriente que admite la salida. Usa un reloj cuadrado TTL (salida TTL del generador) lento, de 1 a 2 Hz, para seguir la cuenta a simple vista; para el analizador lógico lo subirás a 1 kHz."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","La secuencia 7 → 0 → 7 obtenida en el montaje coincide con la esperada.","Tienes el cronograma de SimulIDE y el del analizador lógico real."]}],"heads":["1. Hoja de datos","2. Diseño en papel","3. Esquemas en los simuladores","4. Simulación","5. Foto del montaje","6. Comprobaciones en el montaje real","7. Cronograma con el analizador lógico"]},"5.2":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar un contador asíncrono de módulo 14, que cuenta de 0 a 13 y vuelve a 0, cortando la cuenta natural de 16 estados con una puesta a cero. Verás por qué se detecta un estado «de más».","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA3, criterios a, b, c y e."]},{"t":"ENUNCIADO","p":["Con cuatro biestables JK en modo basculante (J = K = 1) y el reloj de cada etapa tomado de Q de la anterior, el contador cuenta de 0 a 15 de forma natural. Para que se quede en 0 → 13, una puerta NAND detecta el primer estado que no queremos y su salida activa el clear (activo a nivel bajo) de los cuatro biestables.","Tienes que determinar qué estado se detecta, con qué entradas de la NAND, y comprobar que la secuencia real es 0, 1, 2 … 13, 0, 1…"]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje y la alimentación. Monta y cambia cables sin tensión, no dejes entradas al aire (preset y clear incluidos) y pon una resistencia en serie con cada LED, calculada con la corriente que admite la salida. Usa un reloj cuadrado TTL (salida TTL del generador) lento, de 1 a 2 Hz, para seguir la cuenta a simple vista; para el analizador lógico lo subirás a 1 kHz.","Usa LED en las cuatro salidas (un display con 7447 no muestra bien del 10 al 13). El estado que se detecta dura solo unos nanosegundos y no se ve en un LED."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Los 14 estados obtenidos coinciden con los esperados y tras el 13 vuelve a 0.","Tienes el cronograma de SimulIDE y el del analizador lógico real."]}],"heads":["1. Hoja de datos","2. Diseño en papel","3. Esquemas en los simuladores","4. Simulación","5. Foto del montaje","6. Comprobaciones en el montaje real","7. Cronograma con el analizador lógico"]},"5.3":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a comprobar con tus propios ojos que un pulsador mecánico no cierra limpio: usado como reloj de un contador, una sola pulsación suma varios números. Después lo corregirás con un circuito antirrebotes.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA3, criterios c, d, e y f."]},{"t":"ENUNCIADO","p":["Usa el contador de la práctica 5.2 (o un contador de 4 bits cualquiera) y, como reloj, un pulsador con su resistencia de pull-up. Pulsa 10 veces y apunta cuántos números salta el contador en cada pulsación.","Después monta uno de estos antirrebotes y repite las 10 pulsaciones: Opción A, pull-up de 10 kΩ + condensador de 1 µF entre la entrada y GND + inversor Schmitt 74HC14. Opción B, biestable RS con dos NAND (7400) y un conmutador de dos posiciones (con dos resistencias de 10 kΩ)."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje del 74HC14 o del 7400. Monta y cambia cables sin tensión, no dejes entradas al aire (el pulsador sin pull-up deja la entrada flotante) y pon una resistencia en serie con cada LED. No uses un inversor normal (7404) en la opción A: el flanco lento provoca más cuentas."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Con el antirrebotes, cada pulsación suma exactamente 1.","Tienes la captura con analizador lógico sin y con antirrebotes."]}],"heads":["1. Hoja de datos","2. Sin antirrebotes","3. Elección y cálculo","4. Esquemas en los simuladores","5. Foto del montaje","6. Con antirrebotes","7. Cronograma con el analizador lógico"]},"6.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a montar un registro que guarda un dato de 4 bits y lo mantiene aunque las entradas cambien. Es la forma más sencilla de «memoria» en un sistema digital.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA3, criterios a, b, d y e."]},{"t":"ENUNCIADO","p":["Con biestables D (cuatro en un 74HC175, o cuatro mitades de dos 7474) y un reloj común, el dato presente en D3 D2 D1 D0 se copia en Q3 Q2 Q1 Q0 solo en el flanco activo del reloj. Entre flancos, las salidas no cambian aunque cambies las entradas.","Tienes que cargar cuatro datos distintos con interruptores en las entradas, y comprobar en cada caso que la salida solo cambia al dar el pulso de reloj."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje y la alimentación. Monta y cambia cables sin tensión, no dejes entradas al aire (clear incluido) y pon una resistencia en serie con cada LED. Usa un reloj lento o un pulsador con antirrebotes (práctica 5.3) para ver cada pulso; para el analizador lógico sube el reloj a 1 kHz."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","Los cuatro datos se almacenan en el montaje real y la salida solo cambia con el flanco.","Tienes el cronograma de SimulIDE y el del analizador lógico real."]}],"heads":["1. Hoja de datos","2. Diseño en papel","3. Esquemas en los simuladores","4. Simulación","5. Foto del montaje","6. Comprobaciones en el montaje real","7. Cronograma con el analizador lógico"]},"6.2":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a montar un registro de desplazamiento: un dato entra bit a bit por una sola línea y sale, retrasado cuatro pulsos, por otra. Así se comunican muchos periféricos con pocas patillas.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA3, criterios a, b, c y e."]},{"t":"ENUNCIADO","p":["Encadena cuatro biestables D (74HC175 o dos 7474): la salida de cada uno es la entrada del siguiente y todos comparten reloj. En cada flanco, cada bit pasa a la etapa siguiente y la primera toma el valor de la entrada serie.","Tienes que introducir en serie la secuencia 1, 0, 1, 1 (el primer bit que entra es el 1 de la izquierda) y observar la salida serie (Q3, con un solo LED) durante 8 pulsos. Antes de empezar, pon el registro a 0 con el clear. El contenido de las etapas intermedias lo verás con el analizador lógico."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos el patillaje y la alimentación. Monta y cambia cables sin tensión, no dejes entradas al aire (clear incluido) y pon una resistencia en serie con cada LED. Usa un reloj lento o un pulsador con antirrebotes (práctica 5.3) para ver cada pulso; para el analizador lógico sube el reloj a 1 kHz."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","La salida serie Q3 repite la secuencia 1, 0, 1, 1 con cuatro pulsos de retraso.","Tienes el cronograma de SimulIDE y el del analizador lógico real."]}],"heads":["1. Hoja de datos","2. Diseño en papel","3. Esquemas en los simuladores","4. Simulación","5. Foto del montaje","6. Comprobaciones en el montaje real","7. Cronograma con el analizador lógico"]},"7.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar un temporizador de un solo pulso: al pulsar un botón, un LED se enciende un tiempo fijo y se apaga solo. Calcularás ese tiempo, lo cambiarás con otro condensador y lo comprobarás con un cronómetro.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA4, criterios a, b, c y e."]},{"t":"ENUNCIADO","p":["El 555 en modo monoestable da un pulso de duración T = 1,1 · R · C cada vez que su entrada de disparo baja de nivel. Monta el circuito de la figura 7.14: RA = 10 kΩ (resistencia de temporización), C = 100 µF, RB = 10 kΩ (pull-up del disparo con el pulsador), C1 = 10 nF en control y un LED con RL = 180 Ω en la salida.","Tienes que calcular T, comprobar la corriente del LED, montarlo, medir el tiempo con cronómetro, y repetir con C = 47 µF."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos del 555 (NE555 o LM555) el patillaje y el rango de alimentación. Monta y cambia cables sin tensión, no dejes entradas al aire (reset a nivel alto, control con un condensador de 10 nF a masa) y respeta la polaridad del condensador electrolítico. El 555 admite de 5 V a 15 V (la figura indica +10 V): usa 5 V, porque con 180 Ω en serie el LED recibiría demasiada corriente con 10 V."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","El LED permanece encendido un tiempo cercano al calculado con 100 µF y con 47 µF."]}],"heads":["1. Hoja de datos","2. Cálculos","3. Esquemas en los simuladores","4. Simulación","5. Foto del montaje","6. Comprobaciones en el montaje real"]},"7.2":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a montar un oscilador que hace parpadear un LED solo, sin reloj externo. Calcularás cuánto está encendido, cuánto apagado y su frecuencia, y lo comprobarás con un cronómetro.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA4, criterios a, b, c y e."]},{"t":"ENUNCIADO","p":["El 555 en modo astable genera una señal cuadrada con tH = 0,693 · (RA + RB) · C (salida a nivel alto) y tL = 0,693 · RB · C (a nivel bajo). Monta el circuito de la figura 7.15: RA = 10 kΩ, RB = 4,7 kΩ, C = 100 µF, C1 = 10 nF en control y un LED con RL = 180 Ω en la salida.","Tienes que calcular tH, tL, el periodo, la frecuencia y el ciclo de trabajo, comprobar la corriente del LED, montar el circuito y comprobar con cronómetro cuántos parpadeos hay por minuto."]},{"t":"ANTES DE DAR TENSIÓN","p":["Consulta en la hoja de datos del 555 (NE555 o LM555) el patillaje y el rango de alimentación. Monta y cambia cables sin tensión, no dejes entradas al aire (reset a nivel alto, control con un condensador de 10 nF a masa) y respeta la polaridad del condensador electrolítico. El 555 admite de 5 V a 15 V (la figura indica +10 V): usa 5 V, porque con 180 Ω en serie el LED recibiría demasiada corriente con 10 V."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío.","Cada cálculo y cada simplificación llevan sus pasos, no solo el resultado.","Las medidas llevan unidades y el montaje coincide con los esquemas.","El LED parpadea con un periodo cercano al calculado (unos 1,3 s)."]}],"heads":["1. Hoja de datos","2. Cálculos","3. Esquemas en los simuladores","4. Simulación","5. Foto del montaje","6. Comprobaciones en el montaje real"]},"8.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a tomar como referencia el sumador completo de 1 bit hecho con puertas lógicas y a ampliarlo a 2 bits con Icestudio, una herramienta libre para configurar FPGA. Lo verificarás y, si tienes una FPGA, comprobarás que realiza la suma.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA5, criterios b, c y d."]},{"t":"ENUNCIADO","p":["Icestudio es un entorno gráfico libre para FPGA de la familia iCE40: el circuito se dibuja con bloques (puertas, entradas, salidas) y la herramienta lo traduce a Verilog, lo sintetiza y lo carga en la placa (por ejemplo, la Alhambra II). Aquí el circuito se configura, no se cablea.","Parte del sumador completo de 1 bit (entradas A, B y acarreo de entrada Cin; salidas S y acarreo de salida Cout), hecho con puertas lógicas, y haz el esquema con el conexionado necesario para ampliarlo a 2 bits: entradas A1 A0, B1 B0 y Cin; salidas S1 S0 y Cout. Si dispones de la FPGA, sintetiza el circuito y comprueba que suma."]},{"t":"ANTES DE EMPEZAR","p":["Descarga e instala Icestudio (icestudio.io) y su toolchain desde el propio programa (menú Herramientas) antes de empezar: sin la toolchain, «Verificar» falla. Si tienes placa, mira en su documentación si los pulsadores son activos a nivel bajo: la lógica saldría invertida. Guarda el proyecto."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío (salvo la ampliación, que es opcional).","Las capturas se leen y muestran lo que dices.","Las sumas obtenidas coinciden con las esperadas, o has justificado cómo lo comprobaste sin placa."]}],"heads":["1. Tu entorno","2. El sumador completo de 1 bit","3. Ampliación a 2 bits","4. Diseño en Icestudio","5. Asignación de pines","6. Comprobación de la suma","7. Foto de la placa funcionando","8. Preguntas","9. Ampliación (opcional)"]},"9.1":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a programar en Tinkercad un reloj digital que escribe la hora por el monitor serie. Aprenderás a medir el tiempo con millis() y a gestionar los desbordamientos de segundos, minutos y horas.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA5, criterios c y d."]},{"t":"ENUNCIADO","p":["Programa un reloj digital que se imprime por el monitor serie con Serial.println() en formato hh:mm:ss, arrancando en las 09:58:25 y corriendo 10 veces más rápido de lo normal: a 10× cada «segundo» dura 100 ms.","Usa millis() en lugar de delay() para no acumular error, y sprintf() con %02d para que se impriman siempre dos cifras. Solo hace falta la placa Arduino UNO en Tinkercad: todo el trabajo está en el código. Guarda este proyecto: lo reutilizarás en la práctica 10.1."]},{"t":"ANTES DE EMPEZAR","p":["Abre el editor de código de Tinkercad en modo texto. Al comparar los desbordamientos usa >= en lugar de ==. Si usas delay(100) más el tiempo de imprimir, el reloj se retrasa poco a poco."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío (salvo la ampliación, que es opcional).","Las capturas del monitor serie se leen.","Tu código está comentado y guardado en Tinkercad para la práctica 10.1.","El reloj arranca en 09:58:25, avanza a 10× y el formato es siempre hh:mm:ss."]}],"heads":["1. Planteamiento y cálculos","2. Código","3. Esquema en Tinkercad","4. Monitor serie","5. Comprobaciones","6. Preguntas","7. Ampliación (opcional)"]},"9.2":{"boxes":[{"t":"QUÉ VAS A HACER","p":["Vas a diseñar un marcador de fútbol con Arduino que muestra el resultado en una pantalla, primero en Tinkercad y después en protoboard. Practicarás el centrado del texto, la lectura de pulsadores y el antirrebote por software.","Esta hoja es tu cuaderno de trabajo: rellena los cuadros amarillos mientras avanzas. Puedes escribir con libertad, pero con números y pasos.","Trabajas el RA5, criterios c, d, e, f y g."]},{"t":"ENUNCIADO","p":["Diseña un marcador de fútbol que muestre el resultado en formato «X - Y» centrado en la pantalla. Tendrá dos pulsadores (local y visitante) que suman un gol a su equipo y un tercero que pone el marcador a 0 - 0, todos con INPUT_PULLUP.","Tinkercad incluye el LCD de 16×2 (paralelo o I2C), pero no pantallas OLED: en simulación usa el LCD; en la protoboard puedes usar el LCD I2C o una OLED SSD1306 si hay en el taller. Para centrar: columna = (ancho − longitud del texto) / 2.","Los pulsadores rebotan igual que en la práctica 5.4: haz el antirrebote por software, esperando a que la lectura sea estable unos 20–50 ms. Borra la línea antes de reescribirla (si no, quedan restos al pasar de 10 a 0)."]},{"t":"ANTES DE DAR TENSIÓN","p":["Monta y cambia cables sin tensión, no dejes entradas al aire y conecta cada pulsador entre su pin y GND (INPUT_PULLUP). Para el LCD I2C o la OLED consulta en la hoja de tu módulo las patillas de alimentación, SDA y SCL. Si no aparece nada, usa un escáner I2C."]},{"t":"ANTES DE DAR LA PRÁCTICA POR TERMINADA","p":["No queda ningún cuadro amarillo vacío (salvo la ampliación, que es opcional).","Las capturas y fotos se leen y el montaje coincide con el esquema.","El marcador suma goles, se pone a cero y el texto sale centrado, en simulación y en protoboard.","Una pulsación suma un solo gol."]}],"heads":["1. Pantalla y conexiones","2. Centrado del texto","3. Código","4. Esquema en Tinkercad","5. Foto del montaje","6. Comprobaciones","7. Preguntas","8. Ampliación (opcional)"]}};

      <div class="row"><button class="b sm" data-f="ver">Generar Verilog y .pcf</button><button class="b sm prim" data-f="rep">Enviar al informe</button></div><pre id="fpv" class="code sm"></pre></div>`;
    this.ed = new Schem.Editor(el.querySelector('.fp-ed'), { fpga: true, onFrame: () => this.frame(), onChange: (k) => k === 'capture' || this.app.touch('fpga') });

    el.querySelector('.fp-board').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; if (b.dataset.f === 'ver') this.verilog(); if (b.dataset.f === 'rep') { this.verilog(); this.app.caps.fpga = this.ed.svgToDataURL(); this.app.go('report'); } });
    const sv = el.querySelector('#fpsv');

  }
  parts(kind, pin) { return this.ed.doc.parts.filter(p => p.kind === kind && p.props.pin === pin); }
  setPush(b, down) { this.held = this.held || {}; this.held[b] = down; this.parts('PUSH', b).forEach(p => this.ed.setSrc(p, (down ? 1 : 0) ^ (this.activeLow ? 1 : 0))); this.ed.dirty = true; }
  toggleDip(i) { this.parts('SW', 'D' + i).forEach(p => { p.props.on = p.props.on ? 0 : 1; this.ed.setSrc(p, p.props.on); }); this.ed.dirty = true; }
  sync(force) { let ch = false; this.ed.doc.parts.filter(p => p.kind === 'PUSH' && p.props.pin).forEach(p => { const inv = this.activeLow ? 1 : 0; if (p.props.inv !== inv) { p.props.inv = inv; ch = true; } }); if (ch || force) this.ed.recompile(); }
  /* Alhambra II (iCE40HX4K-TQ144): vista superior sobre la serigrafía «Top Designators» de la placa. Formato Arduino UNO, PCB negra. */
  drawBoard() {

    const box = (x, y, w, h, l, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx || 1}" fill="${o.f || '#2a2d2f'}" stroke="${SIL}" stroke-width=".6" opacity=".95"/>` + (l ? T(x + w / 2, y + h / 2 + 2, l, { s: o.s || 5.5 }) : '');

      return t + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#0b0c0d" stroke="#3a3d40" stroke-width=".8"/><circle cx="${x + 6}" cy="${y + 6}" r="1.8" fill="#2d3033"/>` + T(x + w / 2, y + h / 2 + (o.sub ? -1 : 2), l, { s: o.s || 7, c: '#aeb1b3', b: 1 }) + (o.sub ? T(x + w / 2, y + h / 2 + 8, o.sub, { s: 5.5, c: '#80848a' }) : ''); };

  <h2 id="g1">1 · Qué es y cómo se trabaja</h2>
  <p>Son cinco módulos que comparten el mismo motor de simulación. Lo que montas en el esquema y lo que montas en la protoboard se calcula igual (tensiones y corrientes reales de cada nudo, no solo ceros y unos).</p>

  <p><b>Flujo recomendado:</b> abre la práctica en «Prácticas» → lee el enunciado y la hoja de datos del integrado (enlace en la barra superior) → razona el circuito → monta → mide → ajusta → «Informe». La barra de la práctica, bajo el título, tiene el botón «Método de trabajo» con una guía de pasos (no con la solución).</p>

  <h2 id="g2">2 · Tablas y Karnaugh</h2>
  <ol><li>Elige el número de variables (2 a 4) y escribe sus nombres; la primera es la más significativa (MSB). Añade o quita salidas.</li><li>Haz clic en una celda de la tabla de verdad (o del mapa) para ciclar <b>0 → 1 → X → 0</b>. La X es una combinación indiferente: el simulador la toma como 1 o como 0 según convenga y te dice cuáles ha usado.</li><li>Debajo de cada mapa tienes la expresión simplificada (Quine-McCluskey, mínimo exacto), los grupos con su color y las variables que no intervienen.</li><li>Apartado «Circuito con puertas de 2 entradas»: cuenta cuántas puertas e integrados necesitas con puertas estándar o solo con NAND. «Ver Verilog» muestra la función en código.</li><li>«Generar esquema» crea el circuito en el módulo Esquema (úsalo para comprobar tu propio diseño, no para saltártelo); «Comparar con el esquema» confronta la tabla de verdad de lo que has dibujado con la de este módulo y muestra las filas que difieren. «Enviar al informe» guarda mapas y expresiones.</li></ol>

  <h2 id="g3">3 · Esquema lógico</h2>
  <ul><li><b>Cables con codos</b>: pica en una patilla, luego en zonas libres para ir poniendo codos (el trazado sale siempre en horizontal y vertical) y termina picando en otra patilla <b>o en cualquier punto de otro cable</b>, y se crea un nudo ahí. El programa elige el trazado con el mínimo de codos. Esc cancela. También vale arrastrar directamente de patilla a patilla.</li><li><b>Copiar y pegar</b>: selecciona uno o varios componentes (clic o recuadro), Ctrl+C y Ctrl+V. La copia aparece al lado, con los cables que unían los componentes copiados, nuevos identificadores y ya seleccionada para arrastrarla a su sitio. Ctrl+X corta. Funciona también en la protoboard: la copia se pega en columnas libres a un lado.</li><li><b>Interruptor y pulsador</b>: en «Entradas» hay un <b>Interruptor</b> y un <b>Pulsador</b> reales, de dos terminales y con su símbolo eléctrico: abren o cierran el circuito, y tú pones la tensión (+5 V, resistencias, GND). Clic en el interruptor lo abre o cierra; el pulsador conduce mientras lo mantienes pulsado (NA) o al revés (NC). Las «Entrada digital fija» y «Entrada digital pulsada» dan directamente un 0 o un 1, para simplificar.</li><li><b>Colocar</b>: arrastra un componente del catálogo (izquierda) y suéltalo en el lienzo; también vale hacer clic en él y luego en el lienzo. Supr o Retroceso borran la selección. Los integrados salen con su caja y el nombre de cada pata.</li><li><b>Editar valores</b>: doble clic sobre el componente (resistencia, color del LED, nombre, frecuencia del reloj, número de entradas…). El enlace a la hoja de datos de un integrado sale en ese mismo cuadro.</li><li><b>Cablear</b>: arrastra desde una patilla hasta otra (o haz clic en una y luego en la otra). El cable se dibuja ortogonal. Selecciona un cable y pulsa Supr para borrarlo.</li><li><b>Mover</b>: arrastra el componente. Arrastra el fondo para desplazar la vista y usa la rueda para el zoom.</li><li><b>Antes del montaje físico</b>: este esquema se simula por sí solo (pestaña «Esquema lógico», botón Simular). Compruébalo aquí y después móntalo en la protoboard.</li><li><b>Entradas</b>: interruptor (clic para cambiar 0/1), pulsador (activo mientras lo mantienes), reloj (frecuencia en Hz, se edita en Propiedades), +5 V y GND.</li><li><b>Alimentación de los integrados</b>: la casilla «alimentar integrados» suministra VCC y GND automáticamente. <b>Desmárcala si quieres cablearlos tú</b>: sin alimentar, el integrado no funciona y el simulador te lo avisa.</li><li><b>Cronograma</b>: añade «Señal para cronograma» a los nudos que quieras ver. Con los cursores mides periodo, frecuencia y ciclo de trabajo. Los glitches se dibujan.</li><li>«Tabla de verdad del circuito» extrae la tabla de las entradas y salidas rotuladas del esquema.</li></ul>

  <h2 id="g4">4 · Protoboard (830 puntos)</h2>
  <ul><li><b>Mover resistencias, LED y condensadores</b>: arrástralos a cualquier agujero, también a los de los carriles de alimentación. Si los sacas de la placa quedan sueltos y sin conectar (útil para reordenarlos); al devolverlos a un agujero se vuelven a conectar. Los integrados no salen de la placa.</li><li><b>Colocación libre</b>: integrados, microinterruptores, pulsadores, displays y el generador de reloj se pueden poner en cualquier fila de la placa, también sin respetar el canal central. Si se montan mal (patas en cortocircuito, por ejemplo), la simulación lo refleja y salta el aviso.</li><li><b>Autoajuste</b>: junto a Velocidad y Paso. Detecta el reloj más rápido, ajusta velocidad, paso y ventana del analizador y arranca la simulación para que la señal cruce la pantalla en unos 6 s.</li><li><b>Generador de reloj</b>: módulo de 3 patas (VCC, CLK y GND) para las prácticas secuenciales. Alimenta VCC (3,3–5 V) y GND como cualquier integrado, y cablea CLK a la entrada de reloj. Haz clic en él para fijar la frecuencia (de 0,01 Hz a 100 kHz, admite 1k, 10k…) y el ciclo de trabajo. Sin alimentación no da señal.</li><li><b>Disposición</b>: 63 columnas con las filas a–e arriba/f–j abajo unidas dentro de cada columna (el canal central las separa) y 4 carriles de alimentación (T+, T−, B+, B−) de 50 agujeros.</li><li><b>Piezas</b>: arrástralas del catálogo a la placa: resistencia (con código de colores), LED (el extremo con el círculo es el ánodo), condensador, pulsador de 4 patas, minipuerto DIP 8, displays de 7 segmentos (5161 de ánodo común y de cátodo común) e integrados DIP. Al soltar, la pieza se encaja en los agujeros más cercanos: colócala donde quieras, también mal.</li><li><b>Cables</b>: arrastra de un agujero a otro. El color se cambia con doble clic sobre el cable.</li><li><b>Mover y editar</b>: arrastra una pieza para moverla; con la pieza seleccionada aparecen círculos en sus extremos para recolocar solo un lado. Doble clic = cambiar valor (resistencia, color, condensador, referencia del integrado…).</li><li><b>Integrados</b>: se montan a caballo del canal central. Si los sueltas mal alineados, verás qué pasa.</li><li><b>Alimentación</b>: la fuente MB102 va a los carriles. Elige 3,3 V o 5 V en cada carril superior e inferior y su interruptor. Hay que cablear los carriles a las filas, y los integrados necesitan sus patas VCC y GND cableadas.</li><li><b>Vista</b>: rueda = zoom; arrastra el fondo para desplazar. Pasa el ratón por un agujero para ver su tensión y a qué nudo pertenece. En el panel derecho, la tabla de patas de un integrado muestra el nivel de cada una.</li><li><b>Pausar / Reiniciar / Velocidad / Paso</b>: la simulación es de paso fijo. Para ver ceros y unos de un reloj rápido (555), baja el paso; para ver cosas lentas, sube la velocidad.</li></ul>

  <h2 id="g5">5 · Instrumentos y fuente</h2>
  <ul><li><b>Fuente MB102</b> (arriba de la placa, siempre visible): interruptor ON/OFF, y un jumper por cada carril. Pulsa el jumper para cambiarlo: 5 V → 3,3 V → sin jumper (0 V). El visor rojo muestra la tensión que llega al carril. Un integrado 74HC alimentado a 3,3 V responde distinto a uno a 5 V: pruébalo.</li><li><b>Multímetro</b>: botones V, A y Ω en la carcasa (o doble clic). En <b>V</b> mide tensión DC; en <b>A</b> se pone <b>en serie</b> (en paralelo es un cortocircuito y el simulador avisa); en <b>Ω</b> mide la resistencia entre las puntas con el circuito <b>sin alimentar</b> (solo cuentan resistencias y cables; «OL» = circuito abierto). «Anotar medida» la guarda para el informe.</li><li><b>Sonda lógica</b> (lápiz): arrastra su punta a cualquier agujero, carril o patilla. Rojo = nivel alto (≥ 3,3 V), verde = nivel bajo (≤ 1,6 V); sin luz = flotante o intermedio.</li><li><b>Analizador lógico</b>: se coloca como una caja con 8 canales y masa. Arrastra desde el zócalo del canal hasta el agujero que quieras medir; solo se dibujan los hilos que conectes. Para soltar un canal, arrastra su pinza lejos de cualquier agujero.</li><li><b>Cables con codos</b>: pica en un agujero, luego pica en zonas libres de la placa para ir marcando los codos (se colocan entre agujeros, nunca encima) y termina picando en el agujero final. Esc cancela. En un cable ya hecho, selecciónalo y arrastra los rombos naranja para añadir o mover codos.</li><li><b>Serigrafía de los integrados</b>: cada chip muestra la numeración de todas sus patas, con VCC en rojo y GND en marrón. Pasa el ratón sobre una pata para ver su nombre y su función (entrada, salida, alimentación) y sobre el chip para ver qué hace.</li><li><b>Sobrecargas (llama)</b>: si un componente supera sus límites aparece una llama sobre él y el aviso explica la causa. Límites: resistencia 1/4 W (250 mW) · LED y segmentos de display 30 mA · salidas de integrados 25 mA · alimentación de integrados fuera de rango · electrolítico con polaridad invertida. Al quemarse, la resistencia queda abierta y el LED o el integrado dejan de funcionar hasta que pulses «Reiniciar».</li><li><b>Mover y borrar placas</b>: arrastra el Arduino o el ESP32 por su cuerpo para colocarlos donde quieras (los cables siguen a sus pines); con la placa seleccionada, Supr la elimina.</li><li><b>Enunciado y modo libre</b>: al abrir una práctica se muestra su enunciado (botón «Enunciado» en la barra de la práctica para volver a verlo). «Modo libre» en el menú Prácticas abre un espacio general, sin enunciado, para montar lo que quieras.</li><li><b>Girar</b>: con una resistencia, LED o condensador seleccionado, pulsa <b>R</b> para girarlo 90° alrededor de su primera patilla.</li><li><b>Multímetro y analizador</b>: arrastra su cuerpo a cualquier sitio de la pantalla; las puntas y pinzas se llevan a los agujeros arrastrando sus extremos.</li><li><b>Piezas apiladas</b>: si varias piezas se solapan, <b>Alt + clic</b> selecciona la siguiente de las que hay bajo el cursor; así puedes elegir y mover cada una.</li><li><b>Guardado</b>: el trabajo se autoguarda en este navegador tras cada cambio y se recupera al abrir. Para no depender del navegador, activa <b>Archivo → Autoguardado en un archivo…</b> (Chrome/Edge): se reescribe el .json tras cada cambio. La barra inferior indica si hay cambios sin guardar en archivo. Doble clic en el cable para elegir color entre 12.</li></ul>
  <p>Más detalles de cada pieza: pasa el ratón por encima y aparece su ayuda.</p>

  <h2 id="g6">6 · Programar Arduino / ESP32</h2>
  <ul><li>En la pestaña Protoboard coloca una placa (Arduino UNO o ESP32-S3 DevKitC-1) y <b>haz clic en ella</b>: el panel derecho se convierte en el editor del programa, con el monitor serie y la pantalla LCD. «Compilar y simular» lo ejecuta contra lo que hayas cableado en la protoboard.</li><li>El editor colorea el código como el IDE de Arduino, numera las líneas, sangra solo, y sugiere funciones, constantes, métodos de <code>Serial</code> y <code>lcd</code> y plantillas (<code>for</code>, <code>if</code>, <code>switch</code>…) mientras escribes. Ctrl+Espacio fuerza la lista, Tab o Enter aceptan, Ctrl+/ comenta líneas. El selector «Ejemplos» carga programas de partida (Blink, pulsador, semáforo, PWM, voltímetro, LCD, reloj, marcador…) adaptados a la placa elegida.</li><li>Soportado: variables, funciones, <code>if / for / while</code>, <code>millis()</code>, <code>delay()</code>, <code>pinMode / digitalWrite / digitalRead</code>, <code>analogRead / analogWrite</code>, <code>Serial</code>, <code>sprintf</code> y <code>LiquidCrystal</code> (pantalla virtual, no usa pines).</li><li>La división de enteros trunca como en C. No hay desbordamiento de 16 bits en el UNO ni I²C real.</li><li>El ESP32 funciona a 3,3 V: lo que conectes a más de 3,7 V en un pin es una avería, y se avisa.</li><li><code>INPUT_PULLUP</code> activa la resistencia interna: con el pulsador sin pulsar el pin lee 1.</li></ul>

  <h2 id="g7">7 · FPGA Alhambra II</h2>
  <ul><li>Dibuja la función con puertas. A cada interruptor, pulsador o LED asígnale un <b>pin de la placa</b> en Propiedades (SW1, SW2, LED0–LED7, D0–D7).</li><li>La placa virtual muestra los LED y deja pulsar los interruptores. Se generan el Verilog y el fichero de pines <code>.pcf</code> equivalentes a lo que harías en Icestudio.</li><li>Pines verificados con el <code>pinout.json</code> oficial de Icestudio para la Alhambra II: SW1 = 34, SW2 = 33, LED0–LED7 = 45, 44, 43, 42, 41, 39, 38, 37, D0–D7 = 2, 1, 4, 3, 8, 7, 10, 9, reloj 12 MHz = 49. Los pulsadores son de lógica positiva (1 al pulsar).</li></ul>

  <h2 id="g8">8 · Informe de práctica</h2>
  <ul><li>El informe recoge lo que has hecho en cada módulo: tablas, mapas, capturas del esquema, de la protoboard y del analizador, medidas anotadas, código del Arduino, Verilog.</li><li>Las capturas se toman al <b>salir</b> de cada módulo, o con el botón «Captura». «Actualizar datos» vuelve a leerlo todo.</li><li>Las celdas con fondo marcado son para <b>lo medido en el taller</b> y las observaciones; las zonas «Foto» son para subir tus fotos del montaje real.</li><li>«Imprimir / guardar PDF» abre la impresión con portada sin numerar y «Página X de Y» (requiere Chrome o Edge reciente). «Descargar HTML» guarda el informe suelto.</li><li>«Guardar proyecto» crea un .json con todo tu trabajo: es lo que entregas o recuperas otro día. El navegador también guarda una copia automática.</li></ul>

  <h2 id="g9">9 · Errores que puedes cometer (y el simulador reproducirá)</h2>
  <p>Está pensado para que te equivoques y entiendas por qué. Esto es lo que verás:</p>
  <table class="gt"><tr><th>Error</th><th>Qué pasa</th></tr>
  <tr><td>Integrado sin VCC o sin GND</td><td>No funciona; aviso en el panel.</td></tr>
  <tr><td>Entrada de un 74LS al aire</td><td>Flota a ≈ 1,4 V y se interpreta como 1 (TTL). En un 74HC la entrada queda sin definir: el simulador te avisa de que está al aire y no hay que fiarse de la lectura.</td></tr>
  <tr><td>Pull-down de valor alto en TTL</td><td>Por encima de ≈ 2 kΩ la entrada no baja de 0,8 V y no lee 0.</td></tr>
  <tr><td>Tensión de alimentación errónea</td><td>Por encima de ≈ 8 V en un 74LS (8,5 V en un 74HC) el integrado se daña; en polaridad inversa, también.</td></tr>
  <tr><td>LED sin resistencia</td><td>Por encima de 45 mA se quema el LED.</td></tr>
  <tr><td>Condensador electrolítico invertido</td><td>Aviso de avería por polaridad.</td></tr>
  <tr><td>Cortocircuito en la fuente</td><td>Aviso de cortocircuito de alimentación.</td></tr>
  <tr><td>Amperímetro en paralelo</td><td>Equivale a casi un cortocircuito (0,2 Ω): corriente enorme.</td></tr>
  <tr><td>Integrado mal alineado, patas en la misma fila</td><td>Cortocircuita las patas: el simulador lo calcula tal cual.</td></tr>
  <tr><td>Dos salidas conectadas entre sí</td><td>Contienda: tensión intermedia y corriente alta.</td></tr>
  <tr><td>ESP32 con 5 V en un pin</td><td>Avería del pin (> 3,7 V).</td></tr>
  <tr><td>Patillaje equivocado</td><td>Nada te lo impide: es el error más común. Contrasta con la hoja de datos.</td></tr></table>
  <p class="mut">Los avisos no impiden seguir simulando: son el equivalente a que «huela a quemado». Los puedes ignorar y ver las consecuencias.</p>

  <h2 id="g10">10 · Límites del simulador</h2>
  <ul><li>Simulación de paso fijo (10 µs–1 ms). No modela retardos de propagación reales (≈ 10 ns): sí un retardo de un paso, que basta para ver glitches.</li><li>Los modelos de integrados son funcionales: respetan patillaje, tabla y niveles, no todos los límites de la hoja (tiempos de setup/hold, corrientes de fuga…).</li><li>El LCD no pasa por los pines (no puedes equivocarte en su cableado).</li><li>No hay I²C ni OLED real, ni interrupciones del Arduino.</li><li>El informe sin numeración de página en el índice.</li><li>Un resultado del simulador no sustituye a la medida en el taller: es para prepararla y compararla con ella.</li></ul>

  <h2 id="g11">11 · Atajos de teclado</h2>
  <p><b>1–8</b> módulo · <b>PgUp / PgDn</b> anterior / siguiente · <b>Inicio</b> primera página · <b>O</b> índice · <b>G</b> siglas · <b>?</b> ayuda · <b>F</b> pantalla completa · <b>Esc</b> cierra paneles o cancela la herramienta · <b>Supr</b> borra la selección.</p>

  <h2 id="g12">12 · Hojas de datos</h2>
  <p>Los enlaces abren la búsqueda en alldatasheet.es de la versión <b>HC</b> del integrado (fabricante NXP; STMicroelectronics para el NE555). Necesitas conexión a internet.</p>
  <table class="gt"><tr><th>Integrado</th><th>Función</th><th>Hoja de datos</th></tr>${icrows}</table>
  <p class="mut">Los patillajes se revisaron contra las hojas de datos 74LS; la serie 74HC comparte patillaje.</p>
  </article></div>`;
  g.onclick = (e) => { const a = e.target.closest('[data-sc]'); if (a) { e.preventDefault(); const t = g.querySelector('#' + a.dataset.sc); t && t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
}

/* ---------- eventos de los editores ---------- */
App.onSchem = function (k, a) {
  if (k === 'toast') { App.toast(a.msg); return; }
  if (k === 'capture') App.caps.schem = a;
  if (k === 'tt') { const t = a; const m = `Tabla del circuito (${t.inputs.join(', ')} → ${t.outputs.join(', ')}). `; App.lastCompare = m + (t.rows.map(r => r.out.join('')).join(' ')); App.toast('Tabla de verdad extraída del esquema (se compara desde «Tablas y Karnaugh»).'); }
  if (k === 'alert') App.toast(a.msg);
  App.touch();
};
App.onBoard = function (k, a) {
  if (k === 'toast') { App.toast(a.msg); return; }
  if (k === 'capture') { App.caps.board = a; App.toast('Captura guardada para el informe.'); }
  if (k === 'mcu-build') attachMcu(a);
  if (k === 'mcu' || k === 'mcusel') refreshMcu(true);
  if (k === 'log') App.toast(`Medida ${a.n} anotada: ${a.text}`);
  if (k === 'alert') { const al = App.boardEd.sim.alerts.concat((App.boardEd.extraAlerts || []).map(m => ({ msg: m }))); if (al.length) App.toast(al[al.length - 1].msg); }
  App.touch();
};

  App.mced = new CodeEd.Editor($('#mced'), { onInput: () => { const b = App.board.board.mcu; if (b) { b.code = $('#mcc').value; App.touch(); } } }); App.mced.ta.id = 'mcc';

    $('#mcc').value = Mcu.exampleCode(id, b.board); save(); e.target.value = ''; App.touch(); App.toast('Ejemplo cargado. Cablea los pines indicados en los comentarios y pulsa «Compilar y simular».'); };

const EXP_BOTH = { UNO: 1, ESP32: 1 };
function attachMcu(part) {
  const b = App.board.board.mcu; if (!b) return;
  const ctl = new Mcu.McuCtl(b.board, part, b.code || MCU_TEMPLATE, { onSerial: () => { } }); part.ctl = ctl; App.mcuCtl = ctl;
  if (ctl.err) App.toast(ctl.err);
}
function refreshMcu(full) {
  const b = App.board.board.mcu; if (!b) return; if (full) { $('#mcb').value = b.board; if (document.activeElement !== $('#mcc')) $('#mcc').value = b.code != null && b.code !== '' ? b.code : MCU_TEMPLATE; if (b.code == null || b.code === '') b.code = MCU_TEMPLATE; }
}
